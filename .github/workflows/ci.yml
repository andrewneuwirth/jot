name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-26
    steps:
      # Jot builds against a Kit checkout next to it when there is one (see Package.swift).
      - uses: actions/checkout@v4
        with: { path: Jot }
      - uses: actions/checkout@v4
        with: { repository: andrewneuwirth/mac-tools-kit, path: Kit }
      # Package.swift needs Swift 6.2 tools and the macOS 26 SDK, which ship with Xcode 26.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: cd Jot && swift build && .build/debug/Jot --self-check && swift test
